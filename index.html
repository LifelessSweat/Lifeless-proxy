<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifeless Proxy</title>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --bg-card: #121216;
            --accent-red: #ff3333;
            --accent-dim: #990000;
            --text-main: #f5f5f7;
            --text-muted: #8a8a93;
            --border-glow: rgba(255, 51, 51, 0.15);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .lunar-panel {
            background: var(--bg-card);
            border: 1px solid var(--accent-dim);
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 0 30px var(--border-glow);
            width: 420px;
            text-align: center;
            box-sizing: border-box;
        }

        .brand-header {
            margin-bottom: 30px;
        }

        .brand-header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            margin: 0;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .brand-header h1 span {
            color: var(--accent-red);
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
        }

        .brand-header p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 5px 0 0 0;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input[type="password"] {
            width: 100%;
            background: #1a1a22;
            border: 1px solid #2e2e38;
            padding: 14px 16px;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-red);
            box-shadow: 0 0 10px var(--border-glow);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-dim), var(--accent-red));
            color: white;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.95;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        .status-bar {
            margin-top: 30px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid #1e1e24;
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
        }

        .indicator {
            color: var(--accent-red);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="lunar-panel">
    <div class="brand-header">
        <h1>Lifeless<span>Proxy</span></h1>
        <p>Advanced Censorship Evasion Network made by Lifeless_Sweat // v2.4</p>
    </div>
    
    <form action="/login" method="POST">
        <div class="input-wrapper">
            <input type="password" name="password" placeholder="Enter Dynamic Access Token..." required autocomplete="off">
        </div>
        <button type="submit">Establish Safe Tunnel</button>
    </form>
    
    <div class="status-bar">
        <span>Token Cycle: <span class="indicator">24H ROTATING</span></span>
        <span>Node: Secure Pipeline</span>
    </div>
</div>

<script>
    // Global Keyboard Panic Switch (G + C pressed simultaneously redirects to Google Classroom)
    let keysPressed = {};
    document.addEventListener('keydown', (e) => {
        keysPressed[e.key.toLowerCase()] = true;
        if (keysPressed['g'] && keysPressed['c']) {
            window.location.href = "https://google.com";
        }
    });
    document.addEventListener('keyup', (e) => {
        delete keysPressed[e.key.toLowerCase()];
    });
</script>

</body>
</html>
